name: Package v50 source
on:
  push:
    branches: [v1.0.24.50-work]
  workflow_dispatch:
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove git metadata
        run: rm -rf .git .github/workflows/package-v50-source.yml
      - name: Package complete source
        run: zip -r CodeCafe_Atlas_v1.0.24.50_SOURCE.zip . -x '*.pyc' '*/__pycache__/*'
      - uses: actions/upload-artifact@v4
        with:
          name: CodeCafe_Atlas_v1.0.24.50_SOURCE
          path: CodeCafe_Atlas_v1.0.24.50_SOURCE.zip
          retention-days: 7

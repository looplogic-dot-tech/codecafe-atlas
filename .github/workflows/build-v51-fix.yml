name: Build v1.0.24.51 fix

on:
  push:
    branches: ["v1.0.24.51-fix"]
    paths: [".github/workflows/build-v51-fix.yml"]

permissions:
  contents: write

jobs:
  build-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v1.0.24.51-fix
          fetch-depth: 0

      - name: Apply persistent database fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import re

          root = Path('.')
          p = root / 'codecafe_atlas/paths.py'
          s = p.read_text(encoding='utf-8')
          if 'import os\n' not in s:
              s = s.replace('import re\n', 'import os\nimport re\n', 1)

          old = '''def data_dir() -> Path:\n    path = application_root() / "data"\n    path.mkdir(parents=True, exist_ok=True)\n    return path\n'''
          new = '''def _persistent_data_dir() -> Path:\n    override = str(os.environ.get("CODECAFE_ATLAS_DATA_DIR", "")).strip()\n    if override:\n        return Path(override).expanduser().resolve()\n    home = Path.home()\n    if sys.platform.startswith("win"):\n        base = Path(os.environ.get("APPDATA") or os.environ.get("LOCALAPPDATA") or (home / "AppData" / "Roaming"))\n        return base / "CodeCafe-Atlas" / "data"\n    if sys.platform == "darwin":\n        return home / "Library" / "Application Support" / "CodeCafe-Atlas" / "data"\n    base = Path(os.environ.get("XDG_DATA_HOME") or (home / ".local" / "share"))\n    return base / "CodeCafe-Atlas" / "data"\n\ndef data_dir() -> Path:\n    # Packaged builds must keep operational data outside the versioned program\n    # directory. Rebuilding or extracting a new Atlas version must not create a\n    # separate empty database or destroy the user's working database.\n    path = _persistent_data_dir() if getattr(sys, "frozen", False) else application_root() / "data"\n    path.mkdir(parents=True, exist_ok=True)\n    return path\n'''
          if old not in s:
              raise SystemExit('data_dir block not found')
          s = s.replace(old, new, 1)

          marker = '''def database_path() -> Path:\n    path = data_dir() / "atlas.db"\n    _migrate_previous_database_if_needed(path)\n    return path\n'''
          replacement = '''def _legacy_install_database_candidates(current: Path) -> list[Path]:\n    """Find prior packaged Atlas databases for one-time migration.\n\n    This is only used when the new persistent database does not yet exist.\n    Candidates are read-only, must have a recognized Atlas schema, and are\n    copied rather than moved. The source installation is never modified.\n    """\n    roots: list[Path] = []\n    app = application_root()\n    for root in (\n        app.parent,\n        app.parent.parent,\n        app.parent.parent.parent,\n        Path.home() / "Downloads",\n        Path.home() / "Desktop",\n    ):\n        try:\n            resolved = root.resolve()\n        except OSError:\n            continue\n        if resolved not in roots and resolved.exists():\n            roots.append(resolved)\n\n    found: list[Path] = []\n    seen: set[Path] = set()\n    current_resolved = current.resolve()\n    for root in roots:\n        try:\n            iterator = root.rglob("atlas.db")\n            for candidate in iterator:\n                try:\n                    resolved = candidate.resolve()\n                except OSError:\n                    continue\n                if resolved == current_resolved or resolved in seen:\n                    continue\n                # Limit discovery to Atlas-looking installation paths.\n                nearby = "/".join(part.casefold() for part in resolved.parts[-7:])\n                if "atlas" not in nearby:\n                    continue\n                if candidate.parent.name.casefold() != "data":\n                    continue\n                if _looks_like_atlas_database(candidate):\n                    seen.add(resolved)\n                    found.append(candidate)\n        except OSError:\n            continue\n    return found\n\ndef _migrate_previous_install_database_if_needed(current: Path) -> None:\n    global _LAST_DATABASE_MIGRATION\n    if current.exists() and current.stat().st_size > 0:\n        return\n    ranked = []\n    for candidate in _legacy_install_database_candidates(current):\n        counts = _database_counts(candidate)\n        schema_kind = _database_schema_kind(candidate)\n        if not schema_kind:\n            continue\n        # Prefer the database with the most registered equipment, then the most\n        # total operational records, then the newest file. This avoids adopting\n        # a fresh/test build when a fuller working Atlas database is available.\n        ranked.append((counts[1], sum(counts), candidate.stat().st_mtime, candidate, counts, schema_kind))\n    if not ranked:\n        return\n    _, _, _, source, counts, schema_kind = max(ranked, key=lambda item: (item[0], item[1], item[2]))\n    current.parent.mkdir(parents=True, exist_ok=True)\n    shutil.copy2(source, current)\n    _LAST_DATABASE_MIGRATION = (\n        f"Se recuperó la base operativa de una instalación anterior: {source}. "\n        f"Formato: {schema_kind}. Dependencias: {counts[0]}, equipos: {counts[1]}, "\n        f"órdenes: {counts[2]}, contadores: {counts[3]}. "\n        f"Desde ahora Atlas conservará esta base en {current}."\n    )\n\ndef database_path() -> Path:\n    path = data_dir() / "atlas.db"\n    if getattr(sys, "frozen", False):\n        _migrate_previous_install_database_if_needed(path)\n    _migrate_previous_database_if_needed(path)\n    return path\n'''
          if marker not in s:
              raise SystemExit('database_path block not found')
          s = s.replace(marker, replacement, 1)

          old_backups = '''def backups_dir() -> Path:\n    path = application_root() / "backups"\n    path.mkdir(parents=True, exist_ok=True)\n    return path\n'''
          new_backups = '''def backups_dir() -> Path:\n    path = (data_dir().parent / "backups") if getattr(sys, "frozen", False) else (application_root() / "backups")\n    path.mkdir(parents=True, exist_ok=True)\n    return path\n'''
          if old_backups in s:
              s = s.replace(old_backups, new_backups, 1)
          p.write_text(s, encoding='utf-8')

          # Version bump across release metadata/runtime identifiers.
          replacements = {
              'codecafe_atlas/__init__.py': [('1.0.24.50', '1.0.24.51')],
              'codecafe_atlas/counter_inserter_engine.py': [('1.0.24.50', '1.0.24.51')],
              'codecafe_atlas/sync_engine.py': [('1.0.24.50', '1.0.24.51')],
              'build_linux.sh': [('1.0.24.50', '1.0.24.51')],
              'build_windows_release.py': [('1.0.24.50', '1.0.24.51')],
          }
          for name, reps in replacements.items():
              fp = root / name
              text = fp.read_text(encoding='utf-8')
              for a, b in reps:
                  text = text.replace(a, b)
              fp.write_text(text, encoding='utf-8')

          ident = root / 'CODECAFE_ATLAS_IDENTITY.json'
          data = json.loads(ident.read_text(encoding='utf-8'))
          data['version'] = '1.0.24.51'
          ident.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          readme = root / 'README.md'
          text = readme.read_text(encoding='utf-8')
          text = re.sub(r'^# CodeCafe Atlas v[^\n]+', '# CodeCafe Atlas v1.0.24.51', text, count=1)
          section = '''\n## v1.0.24.51 — base de datos persistente entre versiones\n\n- Las compilaciones instaladas dejan de guardar la base operativa dentro de `dist/CodeCafe-Atlas/data`.\n- Linux usa `~/.local/share/CodeCafe-Atlas/data` (o `XDG_DATA_HOME`); Windows y macOS usan sus directorios de datos de usuario equivalentes.\n- En el primer arranque, si todavía no existe una base persistente, Atlas busca instalaciones anteriores, valida que sean bases Atlas y copia la más completa sin borrar ni modificar el origen.\n- La selección prioriza la base con más equipos registrados para evitar adoptar una base nueva o de prueba.\n- Los respaldos de compilaciones instaladas también quedan fuera de la carpeta versionada.\n- Se conserva íntegramente el comportamiento funcional de v1.0.24.50.\n\n'''
          first_break = text.find('\n') + 1
          text = text[:first_break] + section + text[first_break:]
          readme.write_text(text, encoding='utf-8')

          (root / 'CHANGES_v1.0.24.51.md').write_text('''# CodeCafe Atlas v1.0.24.51\n\n- Corrige una regresión de despliegue detectada en v1.0.24.50: cada compilación nueva podía abrir una base vacía o distinta dentro de su propia carpeta `dist`.\n- La base operativa ahora persiste en el directorio de datos del usuario y se comparte entre actualizaciones.\n- En la primera ejecución se recupera de forma no destructiva la base Atlas más completa encontrada en instalaciones anteriores.\n- Ninguna base anterior se elimina ni modifica durante la migración.\n- Conserva las mejoras de v1.0.24.50: carpeta de cédulas recordada, acciones siempre visibles y confirmación fuerte antes de borrar historial.\n''', encoding='utf-8')

          # Source repositories must not contain generated Python bytecode.
          for cache in list(root.rglob('__pycache__')):
              if cache.is_dir():
                  import shutil
                  shutil.rmtree(cache, ignore_errors=True)
          for pyc in root.rglob('*.pyc'):
              pyc.unlink(missing_ok=True)
          PY

      - name: Install validation dependency
        run: python -m pip install --disable-pip-version-check 'openpyxl>=3.1,<4'

      - name: Validate accumulated functionality
        run: |
          python -m py_compile main.py codecafe_atlas/paths.py codecafe_atlas/service_order_page.py codecafe_atlas/counter_registry_page.py
          python validate_public_identity.py
          python validate_full_functionality.py
          python validate_before_build.py
          python validate_homologator_runtime.py

      - name: Test one-time database recovery
        shell: bash
        run: |
          python - <<'PY'
          import os, sqlite3, sys, tempfile
          from pathlib import Path

          home = Path(tempfile.mkdtemp(prefix='atlas-v51-home-'))
          old = home / 'Downloads' / 'CodeCafe_Atlas_v1.0.24.49_SOURCE' / 'dist' / 'CodeCafe-Atlas' / 'data' / 'atlas.db'
          old.parent.mkdir(parents=True, exist_ok=True)
          con = sqlite3.connect(old)
          con.executescript('''
          CREATE TABLE buildings(id INTEGER PRIMARY KEY);
          CREATE TABLE locations(id INTEGER PRIMARY KEY);
          CREATE TABLE dependencies(id INTEGER PRIMARY KEY);
          CREATE TABLE equipment(id INTEGER PRIMARY KEY, dependency_id INTEGER);
          ''')
          con.executemany('INSERT INTO equipment(id, dependency_id) VALUES(?,1)', [(i,) for i in range(1,247)])
          con.executemany('INSERT INTO dependencies(id) VALUES(?)', [(i,) for i in range(1,30)])
          con.commit(); con.close()

          os.environ['HOME'] = str(home)
          os.environ.pop('XDG_DATA_HOME', None)
          sys.frozen = True
          sys.executable = str(home / 'Downloads' / 'CodeCafe_Atlas_v1.0.24.51_SOURCE' / 'dist' / 'CodeCafe-Atlas' / 'CodeCafe-Atlas')
          from codecafe_atlas.paths import database_path
          target = database_path()
          assert target == home / '.local' / 'share' / 'CodeCafe-Atlas' / 'data' / 'atlas.db', target
          assert target.exists(), target
          con = sqlite3.connect(target)
          count = con.execute('SELECT COUNT(*) FROM equipment').fetchone()[0]
          con.close()
          assert count == 246, count
          assert old.exists(), 'source database must not be removed'
          print('PERSISTENT DATABASE MIGRATION TEST: PASS')
          PY

      - name: Remove temporary workflow and refresh hash manifest
        shell: bash
        run: |
          rm -f .github/workflows/build-v51-fix.yml
          python - <<'PY'
          from pathlib import Path
          import hashlib
          root = Path('.')
          manifest = root / 'SOURCE_FILE_HASHES_SHA256.txt'
          lines=[]
          for f in sorted(root.rglob('*')):
              if not f.is_file() or f == manifest or '.git' in f.parts or '__pycache__' in f.parts or f.suffix == '.pyc':
                  continue
              lines.append(f"{hashlib.sha256(f.read_bytes()).hexdigest()}  ./{f.relative_to(root).as_posix()}")
          manifest.write_text('\n'.join(lines)+'\n', encoding='utf-8')
          PY

      - name: Commit v1.0.24.51
        shell: bash
        run: |
          git config user.name "CodeCafe Atlas automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "CodeCafe Atlas v1.0.24.51 - persistent operational database"
          git push origin HEAD:v1.0.24.51-fix

      - name: Package clean source
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile
          root=Path('.')
          out=Path('CodeCafe_Atlas_v1.0.24.51_SOURCE.zip')
          skip_parts={'.git','.venv','build','dist','__pycache__'}
          with zipfile.ZipFile(out,'w',zipfile.ZIP_DEFLATED) as z:
              for f in sorted(root.rglob('*')):
                  if not f.is_file() or f == out or any(p in skip_parts for p in f.parts) or f.suffix == '.pyc':
                      continue
                  z.write(f, f.relative_to(root))
          import hashlib
          sha=hashlib.sha256(out.read_bytes()).hexdigest()
          Path(str(out)+'.sha256').write_text(f'{sha}  {out.name}\n', encoding='utf-8')
          print(sha)
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: CodeCafe_Atlas_v1.0.24.51_SOURCE
          path: |
            CodeCafe_Atlas_v1.0.24.51_SOURCE.zip
            CodeCafe_Atlas_v1.0.24.51_SOURCE.zip.sha256
